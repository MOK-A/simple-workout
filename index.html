}

document.getElementById("import-file-input").addEventListener("change", (e)=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = ""; // reset so re-selecting the same file still fires "change"
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(err){
      showSimpleAlert("Import impossible", "Ce fichier ne contient pas un JSON valide.");
      return;
    }
    if(!parsed || !Array.isArray(parsed.workouts) || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.sessions)){
      showSimpleAlert("Import impossible", "Ce fichier ne correspond pas à un export Simple Workout valide.");
      return;
    }
    openConfirm(
      "Importer ces données",
      "Cela remplacera toutes tes données actuelles (séances, exercices, historique) par le contenu de ce fichier. Cette action est irréversible.",
      ()=>{
        if(!Array.isArray(parsed.debugLog)) parsed.debugLog = [];
        if(!parsed.settings) parsed.settings = { unit:"kg", sound:true, vibration:true };
        if(!parsed.restTimes) parsed.restTimes = {};
        state = parsed;
        currentWorkoutFilter = (state.lastWorkoutId && getWorkout(state.lastWorkoutId)) ? state.lastWorkoutId : (state.workouts.length ? state.workouts[0].id : "ALL");
        editMode = false;
        routineSheetEditMode = false;
        clearDraftCache();
        activeRest = null;
        clearInterval(restTicker);
        restTicker = null;
        persist();
        switchTab(currentTab);
      },
      "Importer"
    );
  };
  reader.onerror = ()=>{
    showSimpleAlert("Import impossible", "Impossible de lire ce fichier.");
  };
  reader.readAsText(file);
});

  }

  del.textContent = cfg.deleteLabel || "Supprimer";
  del.addEventListener("click", cfg.onDelete);
  actions.appendChild(del);
  outer.appendChild(actions);

  const row = document.createElement("div");
  row.className = "manage-row" + (cfg.subtitle ? " has-subtitle" : "");
  row.innerHTML = (cfg.noDrag ? '<span class="drag-handle drag-handle-spacer"></span>' : '<span class="drag-handle">⋮⋮</span>')
    + '<span class="rname-block"><span class="rname"></span>' + (cfg.subtitle ? '<span class="rsubtitle"></span>' : '') + '</span>'
    + '<span class="chev">›</span>';
  if(cfg.subtitle) row.querySelector(".rsubtitle").textContent = cfg.subtitle;
  const rnameEl = row.querySelector(".rname");
  rnameEl.textContent = cfg.label;
  if(cfg.current) rnameEl.classList.add("current");
  outer.appendChild(row);

  attachManageSwipe(outer, row, actions);
  row.addEventListener("click", (e)=>{
    if(e.target.closest(".drag-handle")) return;
    if(row.style.transform && row.style.transform !== "translateX(0px)" && row.style.transform !== "") return;
    if(cfg.onOpen) cfg.onOpen();
  });

  return outer;
}

function attachManageSwipe(outer, row, actionsEl){
  let startX=0,startY=0,dx=0,dragging=false,axis=null;
  const actionsWidth = () => actionsEl.children.length * 64;
  row.addEventListener("pointerdown",(e)=>{
    if(e.target.closest(".drag-handle")) return;
    startX=e.clientX; startY=e.clientY; dragging=true; axis=null;
    if(revealedRowEl && revealedRowEl!==row) closeRevealedRow();
  });
  row.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    const ddx=e.clientX-startX, ddy=e.clientY-startY;
    if(axis===null && (Math.abs(ddx)>8||Math.abs(ddy)>8)) axis = Math.abs(ddx)>Math.abs(ddy)?"x":"y";
    if(axis==="x"){
      const w = -actionsWidth();
      dx = Math.max(w, Math.min(0, ddx + (revealedRowEl===row? w:0)));
      row.style.transform = "translateX("+dx+"px)";
    }
  });
  function end(){
    if(!dragging) return; dragging=false;
    if(axis==="x"){
      const w = -actionsWidth();
      if(dx < w/2){ row.style.transform="translateX("+w+"px)"; revealedRowEl=row; }
      else { row.style.transform="translateX(0)"; if(revealedRowEl===row) revealedRowEl=null; }
    }
  }
  row.addEventListener("pointerup", end);
  row.addEventListener("pointercancel", end);
}

function enableDragReorder(containerEl, itemSelector, dataArray, onDone){
  let dragEl=null, startY=0, placeholderIndex=-1, items=[];
  containerEl.querySelectorAll(itemSelector+" .drag-handle").forEach(handle=>{
    handle.addEventListener("pointerdown",(e)=>{
      e.stopPropagation();
      if(e.cancelable) e.preventDefault();
      dragEl = handle.closest(itemSelector);
      items = Array.from(containerEl.querySelectorAll(itemSelector));
      placeholderIndex = items.indexOf(dragEl);
      startY = e.clientY;
      dragEl.classList.add("drag-active");
      dragEl.style.position="relative"; dragEl.style.zIndex="10";
      dragEl.style.willChange = "transform";
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      let pendingY = null, rafScheduled = false;
      function processMove(clientY){
        const dy = clientY - startY;
        dragEl.style.transform = "translateY("+dy+"px)";
        const midY = clientY;
        for(let i=0;i<items.length;i++){
          if(items[i]===dragEl) continue;
          const rect = items[i].getBoundingClientRect();
          if(midY > rect.top && midY < rect.bottom){
            const curIdx = items.indexOf(dragEl);
            if(i !== curIdx){
              containerEl.insertBefore(dragEl, i < curIdx ? items[i] : items[i].nextSibling);
              items = Array.from(containerEl.querySelectorAll(itemSelector));
              startY = clientY;
              dragEl.style.transform = "translateY(0)";
            }
            break;
          }
        }
      }
      function onMove(ev){
        if(ev.cancelable) ev.preventDefault();
        pendingY = ev.clientY;
        if(!rafScheduled){
          rafScheduled = true;
          requestAnimationFrame(()=>{
            rafScheduled = false;
            if(pendingY !== null) processMove(pendingY);
          });
        }
      }
      function onUp(){
        dragEl.classList.remove("drag-active");
        dragEl.style.transform=""; dragEl.style.position=""; dragEl.style.zIndex=""; dragEl.style.willChange="";
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        const newOrderIds = Array.from(containerEl.querySelectorAll(itemSelector)).map(el=>el.dataset.itemId);
        newOrderIds.forEach((id,i)=>{
          const found = dataArray.find(d=>d.id===id);
          if(found) found.order = i;
        });
        if(onDone) onDone();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  });
}

// Drag-reorder for exercise rows directly on the Séance screen (edit mode).
// Unlike enableDragReorder, the underlying data is a plain array of exercise
// ids (workout.exerciseIds), not a list of objects with an `.order` field.
function enableExerciseDragReorder(containerEl, workoutObj){
  let dragEl=null, startY=0, items=[];
  containerEl.querySelectorAll(".manage-row-outer .drag-handle").forEach(handle=>{
    handle.addEventListener("pointerdown",(e)=>{
      e.stopPropagation();
      if(e.cancelable) e.preventDefault();
      dragEl = handle.closest(".manage-row-outer");
      items = Array.from(containerEl.querySelectorAll(".manage-row-outer"));
      startY = e.clientY;
      dragEl.classList.add("drag-active");
      dragEl.style.willChange = "transform";
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      let pendingY = null, rafScheduled = false;
      function processMove(clientY){
        const dy = clientY - startY;
        dragEl.style.transform = "translateY("+dy+"px)";
        const midY = clientY;
        for(let i=0;i<items.length;i++){
          if(items[i]===dragEl) continue;
          const rect = items[i].getBoundingClientRect();
          if(midY > rect.top && midY < rect.bottom){
            const curIdx = items.indexOf(dragEl);
            if(i !== curIdx){
              containerEl.insertBefore(dragEl, i < curIdx ? items[i] : items[i].nextSibling);
              items = Array.from(containerEl.querySelectorAll(".manage-row-outer"));
              startY = clientY;
              dragEl.style.transform = "translateY(0)";
            }
            break;
          }
        }
      }
      function onMove(ev){
        if(ev.cancelable) ev.preventDefault();
        pendingY = ev.clientY;
        if(!rafScheduled){
          rafScheduled = true;
          requestAnimationFrame(()=>{
            rafScheduled = false;
            if(pendingY !== null) processMove(pendingY);
          });
        }
      }
      function onUp(){
        dragEl.classList.remove("drag-active");
        dragEl.style.transform = ""; dragEl.style.willChange = "";
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        const newOrderIds = Array.from(containerEl.querySelectorAll(".manage-row-outer")).map(el=>el.dataset.itemId);
        workoutObj.exerciseIds = newOrderIds;
        persist();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* ============================================================
   GENERIC CONFIRM / TEXT MODALS
   ============================================================ */
function openConfirm(title, message, onOk, okLabel){
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-ok").textContent = okLabel || "Supprimer";
  confirmCtx = onOk;
  showBackdrop("confirm-modal");
}
document.getElementById("confirm-cancel").addEventListener("click", ()=> hideBackdrop("confirm-modal"));
document.getElementById("confirm-ok").addEventListener("click", ()=>{
  if(confirmCtx) confirmCtx();
  confirmCtx = null;
  hideBackdrop("confirm-modal");
});

function openTextModal(title, initial, onOk){
  document.getElementById("text-modal-title").textContent = title;
  const input = document.getElementById("text-modal-input");
  input.value = initial || "";
  textModalCtx = onOk;
  showBackdrop("text-modal");
  setTimeout(()=>{ input.focus(); input.select(); }, 200);
}
document.getElementById("text-modal-cancel").addEventListener("click", ()=> hideBackdrop("text-modal"));
document.getElementById("text-modal-ok").addEventListener("click", ()=>{
  const val = document.getElementById("text-modal-input").value.trim();
  if(textModalCtx) textModalCtx(val);
  textModalCtx = null;
  hideBackdrop("text-modal");
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.querySelectorAll(".tab-btn").forEach(btn=>{

});

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadState();

  const active = getActiveSession();
  if(active){
    currentWorkoutFilter = active.workoutId;
  } else if(state.lastWorkoutId && getWorkout(state.lastWorkoutId)){
    currentWorkoutFilter = state.lastWorkoutId;
  } else if(state.workouts.length){
    currentWorkoutFilter = state.workouts[0].id;
  } else {
    currentWorkoutFilter = "ALL";
  }

  renderSeance();
  ensureLiveChronoTicker();
}

init();

// Register the service worker so the app works fully offline after the first
// successful load. Safe no-op inside environments without service worker
// support (e.g. Claude's artifact preview) or when sw.js isn't hosted alongside.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

})();
